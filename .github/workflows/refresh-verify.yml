name: refresh verify block

# Rewrites the "currently in production" fingerprint block in profile/README.md
# with the live tag, full SHA, short SHA, and commit timestamp from
# bitPOS-app/bitpos:main. Runs hourly, on manual dispatch, and on cross-repo
# notification (the bitpos repo POSTs here on push/release).

on:
  schedule:
    - cron: '17 * * * *'        # hourly at :17 (avoids cron-storm minute :00)
  workflow_dispatch:             # manual trigger from Actions tab
  repository_dispatch:           # cross-repo: bitpos POSTs here on push/release
    types: [bitpos-deployed]

permissions:
  contents: write

concurrency:
  group: refresh-verify
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live state from bitPOS-app/bitpos
        id: live
        run: |
          API="https://api.github.com/repos/bitPOS-app/bitpos"
          AUTH_HEADER=()
          # Use the built-in token when available (private repos / higher limits),
          # otherwise anonymous access works for a public repo.
          if [ -n "${GH_TOKEN:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${GH_TOKEN}")
          fi

          # Latest release tag (falls back to latest tag, then "untagged")
          TAG=$(curl -sf "${AUTH_HEADER[@]}" "$API/releases/latest" | jq -r '.tag_name // empty')
          if [ -z "$TAG" ]; then
            TAG=$(curl -sf "${AUTH_HEADER[@]}" "$API/tags" | jq -r '.[0].name // "untagged"')
          fi

          # Current main HEAD SHA + commit date
          BRANCH_JSON=$(curl -sf "${AUTH_HEADER[@]}" "$API/branches/main")
          SHA=$(echo "$BRANCH_JSON" | jq -r '.commit.sha')
          DATE=$(echo "$BRANCH_JSON" | jq -r '.commit.commit.author.date')
          SHORT="${SHA:0:7}"

          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"     >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE"   >> "$GITHUB_OUTPUT"

          echo "::notice::live state - tag=$TAG sha=$SHORT date=$DATE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite VERIFY block
        env:
          TAG:   ${{ steps.live.outputs.tag }}
          SHA:   ${{ steps.live.outputs.sha }}
          SHORT: ${{ steps.live.outputs.short }}
          DATE:  ${{ steps.live.outputs.date }}
        run: |
          python3 <<'PY'
          import os, re, pathlib
          p = pathlib.Path('profile/README.md')
          s = p.read_text()
          new = (
              "<!-- VERIFY:START -->\n"
              "```\n"
              f"  tag    │ {os.environ['TAG']}\n"
              f"  sha    │ {os.environ['SHA']}\n"
              f"  short  │ {os.environ['SHORT']}\n"
              f"  built  │ {os.environ['DATE']}\n"
              "```\n"
              "<!-- VERIFY:END -->"
          )
          out, n = re.subn(
              r'<!-- VERIFY:START -->.*?<!-- VERIFY:END -->',
              new, s, count=1, flags=re.DOTALL,
          )
          if n != 1:
              raise SystemExit("ERROR: VERIFY markers not found in profile/README.md")
          p.write_text(out)
          PY

      - name: Commit if changed
        env:
          TAG:   ${{ steps.live.outputs.tag }}
          SHA:   ${{ steps.live.outputs.sha }}
          SHORT: ${{ steps.live.outputs.short }}
        run: |
          git config user.name  "bitpos-verify-bot"
          git config user.email "verify-bot@users.noreply.github.com"
          git add profile/README.md
          if git diff --staged --quiet; then
            echo "::notice::no change - README already up to date"
            exit 0
          fi
          git commit -m "auto: refresh verify block → ${SHORT} ($(date -u +%Y-%m-%dT%H:%MZ))" \
            -m "tag=${TAG} sha=${SHA}"
          git push
